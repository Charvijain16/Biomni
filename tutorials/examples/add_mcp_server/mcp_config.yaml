mcp_servers:
  rcsb:
    # Use the python.exe from the env that has rcsb-api installed (mcp310)
    command:
      - "C:\\Users\\vlad8\\miniconda3\\envs\\mcp310\\python.exe"
      - "-m"
      - "biomni.tool.mcp_tools.rcsb_mcp"
    enabled: true
    description: "RCSB PDB search MCP server"
    tools:
      - biomni_name: rcsb_text_search
        description: "Full-text search for RCSB PDB entries"
        parameters:
          search_string: {type: str, required: true, description: "Query text"}
          max_results:   {type: int, required: false, default: 3, description: "How many IDs to return"}
